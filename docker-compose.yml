services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tenpercent
      POSTGRES_PASSWORD: tenpercent
      POSTGRES_DB: tenpercent
    ports:
      - "5432:5432"
    volumes:
      - tenpercent_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenpercent -d tenpercent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tenpercent_pg:
